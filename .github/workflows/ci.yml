name: CI

# Прогоняем проверки на пул-реквестах и при пуше в основные ветки.
on:
  push:
    branches: [main, "feature/**"]
  pull_request:

# Отменяем устаревшие прогоны при новом пуше в ту же ветку/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────── Python (FastAPI-бэкенд) ───────────────
  python:
    name: Python — Ruff, mypy, unit, E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.8 mypy==1.18.2

      - name: Ruff (линтер)
        run: ruff check .

      - name: Ruff (форматтер)
        run: ruff format --check .

      - name: mypy (типы)
        run: mypy

      - name: Smoke test (без приватного банка)
        working-directory: backend
        run: python -m smoke_test

      - name: Backend regression tests
        working-directory: backend
        run: python -m unittest test_timers test_answers test_teacher_updates

      - name: Isolated HTTP and WebSocket E2E
        working-directory: backend
        run: python -m e2e_test

      - name: Reliability verdict regressions
        run: python -m unittest tools.test_reliability

      - name: Isolated reliability smoke (QR and connection loss)
        run: python tools/reliability_test.py --students 12 --rounds 10 --disconnects --qr --idle 1

  # ─────────────────────────────── Frontend (public/) ────────────────────
  frontend:
    name: Frontend — ESLint, Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint:js

      - name: Inline JavaScript syntax
        run: npm run lint:scripts

      - name: Prettier (проверка формата)
        run: npm run format:check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install demo and browser dependencies
        run: |
          pip install -r requirements.txt
          npx playwright install --with-deps chromium

      - name: Large-class layout (72 participants)
        run: |
          python tools/demo_server.py > /tmp/algoclimb-demo.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid"' EXIT
          npm run test:layout

  # ─────────────────────────────── Docker (сборка образа) ────────────────
  docker:
    name: Docker — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: algoclimb:ci
